# Publish a tagged release to WordPress.org.
#
# Why this exists: the release used to be possible only from the owner's own machine, because that is
# where the Subversion working copy and its cached WordPress.org credentials live. Anyone else - a
# second machine, the dev box, an assistant - could prepare a release to the last comma and then not
# ship it. The credentials belong in exactly one place that is not a laptop: this repository's secrets.
#
# The gate is DEV, not the shop (see bin/release-wporg): the build must be running on the dev site, and
# it must pass Plugin Check and both test suites here, on a real WordPress with real WooCommerce. What
# the shop is running is the owner's own business and no longer holds the directory up.
#
# Triggered by pushing an annotated tag `v<version>` - the tag IS the release decision, and it has to
# agree with the version in the code or nothing happens:
#
#   git tag -a v0.4.18 -m "0.4.18" && git push origin v0.4.18
#
# Required once, in repository settings:
#   Secrets:   SVN_USERNAME, SVN_PASSWORD   (the WordPress.org account that owns the plugin)
#   Secrets:   BGC_LEAK_PATTERNS            (optional; grep -E alternation of strings that must never
#                                            be published - the same value bin/deploy.conf carries)
#   Variables: BGC_DEV_URL                  (optional; defaults to the dev site below)
name: Release to WordPress.org

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SLUG: bg-couriers
  DEV_URL: ${{ vars.BGC_DEV_URL || 'https://dev.dobavki.club' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- The version is one number, in four places now: the tag is the fourth ----------------------
      # 0.2.2 shipped with BGCOURIERS_VERSION left behind, which serves stale cached assets to every
      # customer. A tag that disagrees with the code would publish something nobody named.
      - name: Version agrees with the tag
        run: |
          VERSION="$(grep -m1 '^ \* Version:' ${SLUG}.php | awk '{print $3}')"
          CONST="$(grep -m1 "define('BGCOURIERS_VERSION'" ${SLUG}.php | sed "s/.*'\([0-9.]*\)'.*/\1/")"
          STABLE="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "header=$VERSION constant=$CONST stable=$STABLE tag=$TAG"
          [ "$VERSION" = "$CONST" ] && [ "$VERSION" = "$STABLE" ] || { echo "::error::the three version places disagree"; exit 1; }
          case "$GITHUB_REF_TYPE" in
            tag) [ "$VERSION" = "$TAG" ] || { echo "::error::tag ${GITHUB_REF_NAME} is not version ${VERSION}"; exit 1; } ;;
          esac
          grep -q "^= ${VERSION} =" readme.txt || { echo "::error::readme.txt has no changelog entry for ${VERSION}"; exit 1; }

      # --- Bulgarian, complete and compiled ----------------------------------------------------------
      # A user-facing string added without its Bulgarian lands on a Bulgarian shop in English, and a .mo
      # built from an older .po is a translation WordPress never reads.
      #
      # The staleness test is on CONTENT, not on file dates. bin/preflight compares mtimes, which is right
      # on a working copy somebody has been editing - but a fresh clone has no mtimes worth comparing:
      # git writes every file at checkout time, in whatever order it likes, so "the .po is newer than the
      # .mo" was a coin toss. It came up heads on the first release run and tails on the second, which is
      # how 0.4.19 got refused over a catalogue nobody had touched. Recompiling the .po and comparing the
      # two catalogues as data answers the real question: does the shipped .mo say what the .po says?
      - name: Translations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          bash bin/make-pot --check
          PO=languages/${SLUG}-bg_BG.po
          MO=languages/${SLUG}-bg_BG.mo
          msgfmt -o "${RUNNER_TEMP}/fresh.mo" "$PO"
          # POT-Creation-Date is a timestamp in the header, not a translation; msgfmt stamps the fresh one
          # with today. Everything else must match.
          norm() { msgunfmt "$1" | msgattrib --translated --no-wrap | grep -v '^"POT-Creation'; }
          norm "${RUNNER_TEMP}/fresh.mo" > "${RUNNER_TEMP}/fresh.po"
          norm "$MO" > "${RUNNER_TEMP}/shipped.po"
          if ! diff -q "${RUNNER_TEMP}/fresh.po" "${RUNNER_TEMP}/shipped.po" >/dev/null; then
            echo "::error::the shipped .mo does not match the .po - run: msgfmt -o $MO $PO"
            diff "${RUNNER_TEMP}/fresh.po" "${RUNNER_TEMP}/shipped.po" | head -20
            exit 1
          fi
          echo "translations: $(grep -c '^msgid' "${RUNNER_TEMP}/shipped.po") in the catalogue, .mo matches the .po"
          echo "untranslated: $(msgattrib --untranslated "$PO" | grep -c '^msgid "' || true)"

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1', coverage: none }
      - name: Composer
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: ./vendor/bin/phpunit --testsuite unit

      # --- Real WordPress, real WooCommerce ----------------------------------------------------------
      # The integration suite went unrun long enough once to collect seven failures that were nothing but
      # stale fixtures, and a courier those tests never set up cannot be offered - so their negative
      # assertions were passing for free. It is a release gate, and a slow runner is not a reason to ship.
      - name: Integration tests (wp-env)
        run: |
          npx --yes @wordpress/env start
          BGC_SUITE=integration npx @wordpress/env run tests-cli \
            --env-cwd=wp-content/plugins/${SLUG} -- ./vendor/bin/phpunit --testsuite integration
          # Stopped before the next environment starts: wp-env binds fixed ports, and two of them in one
          # job fight over 8888.
          npx @wordpress/env stop

      # --- The package, built once and checked as it will be published --------------------------------
      # Not the checkout. Plugin Check reads whatever is in the plugin folder, and the folder here carries
      # the workbench: .wp-env.json and phpunit.xml.dist are "hidden files"/"application files" to it, and
      # .github a directory that "should not be included" - all true of the repository and none of it true
      # of the zip, which .distignore strips. Checking the checkout therefore failed the release over
      # files that were never going to be published (first run of this workflow, 2026-09-25). This is the
      # same thing bin/release-wporg does by checking the DEV SITE: a copy with the workbench gone.
      - name: Build the package
        run: |
          bash bin/build-zip "${RUNNER_TEMP}/pkg"
          ZIP="${RUNNER_TEMP}/pkg/${SLUG}-${VERSION}.zip"
          [ -f "$ZIP" ] || { echo "::error::no package was built"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/pkgdir"
          unzip -q "$ZIP" -d "${RUNNER_TEMP}/pkgdir"
          # The wp-env config lives BESIDE the package, never inside it: a .wp-env.json in the plugin
          # folder is one more hidden file for Plugin Check to refuse.
          cat > "${RUNNER_TEMP}/pkgdir/.wp-env.json" <<JSON
          { "core": null, "phpVersion": "8.1",
            "plugins": [ "https://downloads.wordpress.org/plugin/woocommerce.zip", "./${SLUG}" ] }
          JSON

      - name: Plugin Check, on the code that is about to ship
        working-directory: ${{ runner.temp }}/pkgdir
        run: |
          npx --yes @wordpress/env start
          npx @wordpress/env run cli -- wp plugin install plugin-check --activate
          # Warnings are not a release gate here (the directory's own review reads them, a human answers
          # them); an ERROR is. --format=json so the verdict is a field, not a sentence that can be reworded.
          OUT="$( npx @wordpress/env run cli -- wp plugin check ${SLUG} --ignore-warnings --format=json 2>&1 )"
          echo "$OUT"
          if printf '%s' "$OUT" | grep -q '"type":"ERROR"'; then
            echo "::error::Plugin Check reported errors in the package"
            exit 1
          fi
          npx @wordpress/env stop

      # --- The dev site must already be running this build -------------------------------------------
      # The rule this encodes: SVN last, DEV-verified builds only. Read from the readme the site serves,
      # the same way bin/release-status and bin/release-wporg read it.
      - name: Dev is on this version
        run: |
          DEV="$(curl -sS -m 20 -L -A 'bg-couriers release-ci' "${DEV_URL%/}/wp-content/plugins/${SLUG}/readme.txt" \
                 | grep -i '^Stable tag:' | head -1 | awk '{print $3}' | tr -d '\r')"
          echo "dev (${DEV_URL}) is on ${DEV:-unknown}, this is ${VERSION}"
          [ "$DEV" = "$VERSION" ] || { echo "::error::deploy ${VERSION} to dev first"; exit 1; }

      # --- Nothing private in the package ------------------------------------------------------------
      # Host names, phone numbers, the dev address: the last thing between a private string and a public
      # zip. Unset means there is nothing configured to look for, which is said out loud rather than
      # passing quietly.
      - name: Leak check
        env:
          LEAKS: ${{ secrets.BGC_LEAK_PATTERNS }}
        run: |
          if [ -z "$LEAKS" ]; then echo "::warning::BGC_LEAK_PATTERNS is not set - the package was not checked for private strings"; exit 0; fi
          if unzip -p "$ZIP" '*' | grep -aEq "$LEAKS"; then echo "::error::the package contains a string that must never be published"; exit 1; fi
          echo "the package carries none of the configured private strings"

      # --- The directory ------------------------------------------------------------------------------
      # 10up's action is what does the Subversion work: trunk, the assets from .wordpress-org, and the
      # tag, honouring .distignore exactly as bin/build-zip does. A tag that already exists is refused by
      # WordPress.org itself, which is the behaviour we want: a published tag never changes.
      - name: Publish
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: bg-couriers
          ASSETS_DIR: .wordpress-org

      # --- Did the directory pick it up yet ------------------------------------------------------------
      # Separate from the release itself, on purpose: by this point the commit to WordPress.org's SVN has
      # happened and cannot be un-happened. How long the directory takes to re-index it is the
      # directory's business - minutes usually, sometimes longer - and failing the run over that would
      # call a finished release broken.
      #
      # What it must NOT do is what it did on 0.4.21: print ::warning:: and finish, which leaves a green
      # tick beside "The directory serves it" while the directory was still serving the version before.
      # A warning does not fail a step, so the tick meant nothing. The answer now goes into the job
      # summary - the page anybody opens after a release - and the step is named as the question it
      # actually answers.
      - name: Did the directory pick it up yet
        run: |
          for i in 1 2 3 4 5 6; do
            GOT="$(curl -sS -m 20 "https://api.wordpress.org/plugins/info/1.0/${SLUG}.json" \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
            if [ "$GOT" = "$VERSION" ]; then
              echo "### ✅ ${SLUG} ${VERSION} is published and the directory serves it" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "directory still on ${GOT:-?} (try $i)"
            sleep 30
          done
          {
            echo "### ⏳ ${SLUG} ${VERSION} is published, the directory has not re-indexed yet"
            echo ""
            echo "The SVN commit is done: trunk and \`tags/${VERSION}\` carry it."
            echo "The directory usually catches up within minutes - check"
            echo "<https://wordpress.org/plugins/${SLUG}/>. Nothing to re-run here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::published, but the directory still serves ${GOT:-an older version}"
